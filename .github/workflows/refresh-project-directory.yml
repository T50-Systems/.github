name: Refresh public project directory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: read

concurrency:
  group: refresh-public-project-directory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Refresh approved public metadata and profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run directory:refresh
      - name: Validate generated changes
        run: |
          pnpm test
          pnpm run validate
      - name: Open review pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/refresh-public-project-directory
          delete-branch: true
          commit-message: "chore: refresh public project directory"
          title: "chore: refresh public project directory"
          body: |
            Refreshes the checked-in public metadata snapshot and generated organization profile from the explicitly approved allowlist.

            - Reads only exact allowlisted public repository endpoints.
            - Does not change editorial status or intended-user metadata.
            - Requires human review; this workflow never merges the pull request.
            - Independent-review enforcement remains tracked in #10.
          draft: always-true
          add-paths: |
            data/public-project-metadata.json
            PROFILE/README.md
